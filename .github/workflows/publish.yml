name: Publish to PyPI

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Verify the tag matches the package version
        # guards against tagging/publishing the wrong commit: the pushed v* tag
        # must equal __version__ (single source of truth) or the release stops.
        id: version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          ver="$(python -c "import re,pathlib; print(re.search(r'__version__ = \"([^\"]+)\"', pathlib.Path('src/coop_data_doc/__init__.py').read_text()).group(1))")"
          echo "tag=$tag  version=$ver"
          if [ "$tag" != "$ver" ]; then
            echo "::error::Tag v$tag does not match package version $ver — bump __version__ or retag."
            exit 1
          fi
          echo "version=$ver" >> "$GITHUB_OUTPUT"
      - run: pip install build
      - run: python -m build
      - name: Smoke-test the wheel
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install dist/*.whl
          /tmp/smoke/bin/coop-data-doc --version
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # PyPI trusted publishing
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1

  release:
    # after PyPI succeeds, cut a GitHub Release with notes auto-generated from
    # the merged PRs / commits since the previous tag.
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --generate-notes --verify-tag

  website:
    # After the GitHub Release exists, ask kabukisensei/coop-website to sync.
    # This workflow runs only on tag push, so the tag is github.ref_name
    # (there is no workflow_dispatch inputs.tag). The receiver expects
    # event_type coop-release and client_payload {repo, tag} with tag vX.Y.Z.
    # No `if:` — the release job is gated only by needs: publish, and this
    # job waits on that same release job.
    name: dispatch the coop-website sync
    needs: [release]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Dispatch coop-release
        env:
          DISPATCH_TOKEN: ${{ secrets.COOP_WEBSITE_DISPATCH_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          repo="${GITHUB_REPOSITORY#*/}"
          if [ -z "${DISPATCH_TOKEN}" ]; then
            echo "::notice title=coop-website sync skipped::No COOP_WEBSITE_DISPATCH_TOKEN secret. The release is published. Run the sync-release workflow in kabukisensei/coop-website by hand (repo: ${repo}, tag: ${TAG})."
            exit 0
          fi
          if [ -z "${TAG}" ]; then echo "::error::No release tag to send."; exit 1; fi
          payload="$(jq -n --arg repo "$repo" --arg tag "$TAG" '{event_type:"coop-release",client_payload:{repo:$repo,tag:$tag}}')"
          curl --fail-with-body --silent --show-error --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${DISPATCH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --data "${payload}" \
            "https://api.github.com/repos/kabukisensei/coop-website/dispatches"
