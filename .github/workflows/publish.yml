name: Publish to PyPI

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Verify the tag matches the package version
        # guards against tagging/publishing the wrong commit: the pushed v* tag
        # must equal __version__ (single source of truth) or the release stops.
        id: version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          ver="$(python -c "import re,pathlib; print(re.search(r'__version__ = \"([^\"]+)\"', pathlib.Path('src/coop_data_doc/__init__.py').read_text()).group(1))")"
          echo "tag=$tag  version=$ver"
          if [ "$tag" != "$ver" ]; then
            echo "::error::Tag v$tag does not match package version $ver — bump __version__ or retag."
            exit 1
          fi
          echo "version=$ver" >> "$GITHUB_OUTPUT"
      - run: pip install build
      - run: python -m build
      - name: Smoke-test the wheel
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install dist/*.whl
          /tmp/smoke/bin/coop-data-doc --version
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # PyPI trusted publishing
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  release:
    # after PyPI succeeds, cut a GitHub Release with notes auto-generated from
    # the merged PRs / commits since the previous tag.
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --generate-notes --verify-tag

  website:
    # The coop-website sync (its .github/workflows/sync-release.yml, which moves the
    # site's badges, pins and changelog and opens the PR) is a reusable workflow in a
    # PRIVATE repository, and GitHub lets only private repositories call those; this
    # repository is public, so a `uses:` of it fails at planning and the tag's run
    # never starts. This job prints the command a person runs in a coop-website clone.
    needs: [build, release]
    runs-on: ubuntu-latest
    steps:
      - name: Say how to sync the site
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          echo "::warning::sync the site by hand in a coop-website clone:  bash scripts/sync-release.sh coop-data-doc $VERSION"
